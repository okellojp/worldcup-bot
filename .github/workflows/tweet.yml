# .github/workflows/tweet.yml
# Place this file at: .github/workflows/tweet.yml in your repo

name: Post Soccer Tweet

on:
  schedule:
    # Times in UTC (subtract 3hrs for East Africa Time)
    - cron: '0 4 * * *'    # 7:00 AM EAT  — Morning news
    - cron: '30 6 * * *'   # 9:30 AM EAT  — Banter/hot take
    - cron: '0 9 * * 1,3,5' # 12:00 PM EAT — Poll days Mon/Wed/Fri
    - cron: '0 12 * * *'   # 3:00 PM EAT  — Afternoon post
    - cron: '0 15 * * *'   # 6:00 PM EAT  — Evening banter
    - cron: '0 18 * * *'   # 9:00 PM EAT  — Night take
    - cron: '0 20 * * *'   # 11:00 PM EAT — Late night
  workflow_dispatch:        # Manual trigger from GitHub Actions UI

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run bot
        run: node bot.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
